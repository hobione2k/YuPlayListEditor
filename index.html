<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    CSP(コンテンツセキュリティポリシー)
    ・スクリプト/スタイルは自サイトのファイルのみ許可
    ・画像はYouTubeのサムネイル配信元のみ許可
    ・iframeはYouTube(プライバシー強化モード)の埋め込みのみ許可
    ・通信(fetch)はタイトル取得用のYouTube oEmbedのみ許可
    ・フォーム送信は全面禁止(外部へのデータ送信を防止)
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src https://www.youtube.com; base-uri 'none'; form-action 'none'">
  <!-- YouTube埋め込みはリファラが必要なため、オリジンのみ送信する設定にする -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YuPlayListEditor</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- 画面描画前にテーマを適用してちらつきを防ぐため、head内で読み込む -->
  <script src="./js/theme.js"></script>
</head>
<body>
  <!-- UI全体を囲むパネル(画面中央に配置) -->
  <div class="panel">
  <header class="app-header">
    <h1>YuPlayListEditor</h1>
    <!-- ヘッダー右側のボタン群 -->
    <div class="header-actions">
      <!-- 埋め込み動画の拡大表示ON/OFF切り替え(ON: 画面幅いっぱい / OFF: パネル幅) -->
      <button type="button" class="size-toggle" id="size-toggle" aria-pressed="false">
        <!-- 拡大アイコン(左右外向きの矢印 ←→): OFFのときに表示 -->
        <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- 縮小アイコン(左右内向きの矢印 →|←): ONのときに表示 -->
        <svg class="icon-collapse" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M2 12h7M6 9l3 3-3 3M22 12h-7M18 9l-3 3 3 3M12 6v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- ライト/ダークテーマ切り替えボタン(表示文字はtheme.jsで設定) -->
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
    </div>

    <!-- YamaPlayer形式JSONのインポート・エクスポート(タイトルの下に常時表示するツールバー) -->
    <section class="io-section" aria-label="YamaPlayer形式でのインポート・エクスポート">
      <div class="io-bar">
        <!-- インポート用のドロップエリア(左側)
             ・JSONファイルをドロップすると読み込む(ドロップ処理はapp.jsでページ全体に設定)
             ・クリック/Enterキーでファイル選択ダイアログを開く(labelで非表示のファイル選択欄と関連付け) -->
        <label class="drop-zone" id="drop-zone" for="import-file" tabindex="0">
          <a href="https://github.com/koorimizuw/YamaPlayer" target="_blank" rel="noopener noreferrer">YamaPlayer</a>
          プレイリスト(json)をドラッグ&amp;ドロップまたはクリックして読み込み
        </label>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <!-- エクスポートボタン(右側)。ファイル保存を表すダウンロードアイコンで表示する -->
        <button type="button" class="io-btn" id="export-json" aria-label="YamaPlayer形式(json)でエクスポート" title="YamaPlayer形式(json)でエクスポート">
          <!-- ダウンロードアイコン(下向き矢印とトレイ) -->
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <!-- インポート・エクスポート結果などのメッセージ -->
      <p class="message" id="status" role="status"></p>
    </section>
  </header>

  <main class="layout">
    <!-- 動画プレイヤー領域 -->
    <section class="player-area" id="player-area">
      <div class="player-frame" id="player">
        <p class="player-placeholder">再生リストから動画を選択してください</p>
      </div>
      <h2 class="now-playing" id="now-playing"></h2>
    </section>

    <!-- 再生リスト領域 -->
    <section class="playlist-area">
      <!-- 再生リストのアコーディオン(各リストの中身はapp.jsで生成) -->
      <div class="accordion" id="accordion"></div>
      <p class="empty" id="no-lists" hidden>再生リストがありません</p>

      <!-- 新しい再生リストの作成ボタン -->
      <button type="button" class="new-list-btn" id="new-list">＋ 新しい再生リスト</button>
    </section>
  </main>

  <!-- フッター(リポジトリとライセンスへのリンク) -->
  <footer class="app-footer">
    <a href="https://github.com/hobione2k/YutPlayList" target="_blank" rel="noopener noreferrer">Repository</a>
    <span class="footer-sep" aria-hidden="true">|</span>
    <a href="https://github.com/hobione2k/YutPlayList/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a>
  </footer>
  </div>

  <!-- YamaPlayer形式JSONの変換処理(app.jsから使うため先に読み込む) -->
  <script src="./js/yamaplayer.js"></script>
  <script src="./js/app.js"></script>
  <!-- 埋め込み動画の表示サイズ切り替え -->
  <script src="./js/player-size.js"></script>
</body>
</html>
